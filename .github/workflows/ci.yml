name: CI

on:
  push:
    branches: [ main, reprise/base-main-locale, 'codex/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.2' ]
    name: Quality / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dev/smoke/package-lock.json
      - name: Install quality tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext rsync
          npm ci --prefix dev/smoke
      - name: Unified quality gate
        run: php dev/test-all.php
